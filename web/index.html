<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoLogger 解析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>EcoLogger 解析</h1>
  <button id="open" type="button">走行を開く…</button>
  <select id="recent" aria-label="最近開いた走行"><option value="">最近開いた走行</option></select>
  <div class="seg" role="radiogroup" aria-label="周の切り方">
    <label title="コースの線で、測位から周を切り直したもの"><input type="radio" name="mode" value="app" checked>コースの線で切った周</label>
    <label title="ロガーが走りながら数えた周"><input type="radio" name="mode" value="logger">ロガーの数え</label>
  </div>
  <span class="grow"></span>
  <span id="status" class="status">つないでいます…</span>
</header>
<main class="layout">
  <section class="pane laps">
    <h2>周</h2>
    <div id="message" class="message" hidden></div>
    <div id="sessions"><p class="empty">「走行を開く…」で、走行のフォルダー（名前が .ecorun で終わるもの）を選びます。別の日の走行も続けて開けます。</p></div>
  </section>
  <section class="pane graph">
    <div class="gbar">
      <h2>グラフ</h2>
      <div class="seg" role="radiogroup" aria-label="横軸">
        <label title="基準の周の走った線に沿った距離。ほかの周は位置で合わせる"><input type="radio" name="xaxis" value="dist" checked>距離</label>
        <label title="周の頭からの時間"><input type="radio" name="xaxis" value="time">時間</label>
      </div>
      <details class="chanpick"><summary>チャンネル</summary><div id="chanlist" class="chanlist"></div></details>
      <label class="refpick">基準 <select id="refsel"></select></label>
      <span class="grow"></span>
      <span class="hint">ホイールで拡大・ドラッグで移動・ダブルクリックで全体</span>
    </div>
    <div id="legend" class="legend"></div>
    <p id="graphEmpty" class="empty">周の表で周を選ぶと、ここに重ねて出します（8周まで）。2周以上選ぶと、基準の周とのタイムの差も出します。</p>
    <div id="plots" class="plots"></div>
  </section>
  <section class="pane map">
    <h2>コース図</h2>
    <p class="empty">周の線とカーソル。</p>
  </section>
  <section class="pane video">
    <h2>動画</h2>
    <p class="empty">カーソルに合わせて動く動画。2周を並べて比べる。</p>
  </section>
</main>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
